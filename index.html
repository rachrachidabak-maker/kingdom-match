<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Match</title>
<style>
:root{
  --bg1:#7655ea; --bg2:#4330ad; --panel:#5f44cf; --panel2:#7d60f2; --hole:#2f1f80;
  --text:#fff8e7; --muted:#e3dcff; --gold:#ffc83d; --gold2:#ff9d1a;
  --cell:rgba(255,255,255,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#7655ea;--bg2:#4330ad;--panel:#5f44cf;--panel2:#7d60f2;--hole:#2f1f80;--text:#fff8e7;--muted:#e3dcff;--cell:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg1:#7655ea;--bg2:#4330ad;--panel:#5f44cf;--panel2:#7d60f2;--hole:#2f1f80;--text:#fff8e7;--muted:#e3dcff;--cell:rgba(255,255,255,.14)}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg2);background:radial-gradient(120% 70% at 50% 0%,var(--bg1),var(--bg2));color:var(--text);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box;gap:8px}
.stat{display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 10px 2px 8px;min-height:36px;color:var(--text);font-weight:800;font-size:16px;box-shadow:none}
.chip svg{width:20px;height:20px}
.chip small{font-size:12px;color:var(--muted);font-weight:700}
.glow{border-color:var(--gold);animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,200,61,.45)}}
.top{display:flex;align-items:stretch;gap:8px}
.lvl{background:linear-gradient(var(--gold),var(--gold2));color:#4a2300;border-radius:14px;padding:6px 12px;font-weight:800;font-size:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;box-shadow:0 3px 0 #b5640a;min-height:0}
.lvl small{font-size:11px;font-weight:700;opacity:.8}
.goals{flex:1;background:var(--panel);border-radius:14px;padding:5px 8px;display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:2px 8px;border:2px solid rgba(255,200,61,.35)}
.goal{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px}
.goal svg,.goal .gi{width:26px;height:26px;display:block}
.goal.done{opacity:.55}
.goal.done b::after{content:" ✓";color:#5df08c}
.moves{background:var(--panel);border-radius:14px;padding:4px 10px;text-align:center;border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;justify-content:center;min-width:58px}
.moves b{font-size:24px;line-height:1;color:var(--gold)}
.moves small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.15}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{position:relative;z-index:0;overflow:hidden;border-radius:16px;border:4px solid var(--gold);box-shadow:0 0 0 3px #b5640a,0 10px 30px rgba(0,0,0,.45);background-color:var(--panel);touch-action:none;box-sizing:content-box}
#board.hamming{cursor:crosshair;box-shadow:0 0 0 3px #ff4d5a,0 0 24px rgba(255,77,90,.7)}
#board.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
.tile,.crate,.hole,.ice{position:absolute;left:0;top:0}
.ice{z-index:0}
.tile{z-index:1;transition:transform .24s cubic-bezier(.3,1.25,.5,1),opacity .2s;will-change:transform}
.crate{z-index:2}
.hole{z-index:3;background:var(--hole);box-shadow:inset 0 0 12px rgba(0,0,0,.7)}
.in{width:100%;height:100%;padding:7%;box-sizing:border-box;transition:transform .12s}
.crate .in{padding:4%}
.ice .in{padding:2%}
.tile svg,.crate svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35))}
.ice svg{width:100%;height:100%;display:block}
.tile.sel .in{transform:scale(1.18)}
.tile.sp .in{animation:pulse 1s ease-in-out infinite}
.pop .in{animation:pop .22s ease-in forwards !important}
.crate.hit .in{animation:wobble .25s}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(1.2);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes wobble{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
#fx{position:absolute;left:0;top:0;z-index:6;pointer-events:none}
.toast{position:absolute;left:50%;top:42%;z-index:7;font-weight:900;font-size:32px;color:var(--gold);text-shadow:0 3px 0 #7a3b00,0 0 14px rgba(255,200,61,.8);pointer-events:none;white-space:nowrap;animation:toast .95s ease-out forwards}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
#king{position:absolute;left:6px;bottom:6px;z-index:8;display:flex;align-items:flex-end;gap:4px;pointer-events:none;opacity:0;transform:translateY(24px);transition:opacity .22s,transform .22s}
#king.on{opacity:1;transform:none}
#bubble{background:#fff8e7;color:#3a2200;font-weight:800;font-size:14px;padding:5px 10px;border-radius:12px 12px 12px 2px;margin-bottom:22px;max-width:160px;line-height:1.15}
.bottom{display:flex;align-items:stretch;gap:6px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 14px;cursor:pointer;color:#fff;background:var(--panel2);box-shadow:0 3px 0 rgba(0,0,0,.35);min-height:44px}
button.chip,button.lvl{box-shadow:none}
button.lvl{box-shadow:0 3px 0 #b5640a}
button.chip{border:2px solid rgba(255,255,255,.14);background:var(--panel);min-height:36px;padding:2px 10px 2px 8px}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.tool{flex:1;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:20px;min-height:48px}
button.tool small{font-size:11px;opacity:.85;font-weight:700}
button.tool.on{background:#ff4d5a;box-shadow:0 3px 0 #a31b2a}
button.big{background:linear-gradient(#5df08c,#1fb85a);color:#06361a;box-shadow:0 4px 0 #107a39;font-size:19px;padding:11px 24px}
button.gold{background:linear-gradient(var(--gold),var(--gold2));color:#4a2300;box-shadow:0 4px 0 #b5640a}
button.danger{background:#a31b2a}
#ov{position:fixed;inset:0;background:rgba(10,4,34,.76);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov.show{display:flex}
.card{background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--gold);border-radius:22px;padding:20px 18px;text-align:center;max-width:340px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 6px;font-size:27px;color:var(--gold)}
.card p{margin:0 0 12px;color:var(--text);font-size:16px;line-height:1.25}
.card .muted{font-size:13px;color:var(--muted)}
.stars{font-size:38px;letter-spacing:4px;margin-bottom:4px;color:var(--gold)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:52vh;overflow:auto;margin-bottom:12px;padding:2px}
.node{display:flex;flex-direction:column;align-items:center;padding:6px 0;font-size:18px;line-height:1.1;min-height:52px}
.node small{font-size:10px;color:var(--gold);letter-spacing:0}
.node.cur{background:linear-gradient(var(--gold),var(--gold2));color:#4a2300}
.node.cur small{color:#4a2300}
.slot{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;margin-bottom:6px;font-weight:800}
.slot button{min-height:36px;padding:4px 12px;background:linear-gradient(var(--gold),var(--gold2));color:#4a2300}
.card svg.scene{width:100%;height:auto;border-radius:14px;margin-bottom:8px;display:block}
.days{display:flex;gap:5px;justify-content:center;margin:6px 0 12px}
.days span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.days span.on{background:var(--gold);color:#4a2300}
label.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:700;font-size:15px;text-align:left}
label.set input[type=range]{flex:1;max-width:150px}
textarea{width:100%;box-sizing:border-box;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:var(--text);font-size:12px;padding:6px;margin-bottom:8px;resize:none;font-family:monospace}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.sp .in{animation:none}#board.shake{animation:none}.glow{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d5a"/><stop offset=".25" stop-color="#ffc83d"/><stop offset=".5" stop-color="#3ddc84"/><stop offset=".75" stop-color="#3d8bff"/><stop offset="1" stop-color="#b061ff"/></linearGradient>
    <symbol id="heart" viewBox="0 0 100 100"><path d="M50 90 C8 60 4 28 27 19 C40 14 48 21 50 30 C52 21 60 14 73 19 C96 28 92 60 50 90Z" fill="#ff4d5a" stroke="#8c1426" stroke-width="5"/><path d="M28 30 C32 24 40 24 43 30" stroke="#fff" stroke-opacity=".7" stroke-width="6" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffc83d" stroke="#a65d00" stroke-width="6"/><circle cx="50" cy="50" r="27" fill="none" stroke="#ff9d1a" stroke-width="7"/><path d="M42 36 L50 62 L58 36" fill="none" stroke="#a65d00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <div class="stat">
    <button class="chip" id="livesBtn" aria-label="Vies"><svg><use href="#heart"/></svg><b id="lives">5</b><small id="lifeTimer"></small></button>
    <button class="chip" id="coinsBtn" aria-label="Pièces"><svg><use href="#coin"/></svg><b id="coins">0</b></button>
    <button class="chip" id="dailyBtn" aria-label="Cadeau du jour">🎁</button>
    <button class="chip" id="castleBtn" aria-label="Château">🏰</button>
    <span style="flex:1"></span>
    <button class="chip" id="setBtn" aria-label="Réglages">⚙️</button>
  </div>
  <div class="top">
    <button class="lvl" id="lvlBtn" aria-label="Carte des niveaux"><small>Niveau</small><span id="lvl">1</span></button>
    <div class="goals" id="goals"></div>
    <div class="moves"><b id="moves">0</b><small id="movesLbl">coups</small><small>★ <span id="score">0</span></small></div>
  </div>
  <div id="wrap">
    <div id="board"><canvas id="fx"></canvas></div>
    <div id="king"><span id="kingFace"></span><div id="bubble"></div></div>
  </div>
  <div class="bottom">
    <button class="tool" id="ham" aria-label="Marteau"><span>🔨</span><small>30</small></button>
    <button class="tool" id="bmb" aria-label="Bombe"><span>💣</span><small>60</small></button>
    <button class="tool" id="plus" aria-label="Coup ou temps en plus"><span>➕</span><small>40</small></button>
    <button class="tool" id="shuf" aria-label="Mélanger"><span>🔀</span><small id="shufC">gratuit</small></button>
    <button class="tool" id="rest" aria-label="Recommencer"><span>↻</span><small>&nbsp;</small></button>
  </div>
</div>

<div id="ov"><div class="card" id="card"></div></div>

<script>
const COLS = 8, ROWS = 9;
const COLORS = ['#ff4d5a', '#3d8bff', '#3ddc84', '#ffc83d', '#b061ff'];
const LETTERS = ['R', 'B', 'V', 'J', 'M'];
const SHAPES = [
  'M18 10 H82 Q90 10 90 18 V82 Q90 90 82 90 H18 Q10 90 10 82 V18 Q10 10 18 10 Z',
  'M50 6 L88 20 V50 C88 74 70 88 50 95 C30 88 12 74 12 50 V20 Z',
  'M50 6 L89 28 V72 L50 94 L11 72 V28 Z',
  'M50 4 L62 37 L97 38 L69 59 L79 94 L50 73 L21 94 L31 59 L3 38 L38 37 Z',
  'M50 4 L94 50 L50 96 L6 50 Z'
];
const MASKS = [
  ['########','########','########','########','########','########','########','########','########'],
  ['.######.','.######.','########','########','########','########','########','.######.','..####..'],
  ['##....##','##....##','###..###','########','########','###..###','##....##','##....##','##....##'],
  ['...##...','..####..','.######.','########','########','.######.','..####..','...##...','...##...'],
  ['########','########','##....##','##....##','##....##','##....##','########','########','########']
];
const STORY = [
  'Le roi Alaric a perdu son château dans une tempête de gemmes. Aide-le à tout reconstruire !',
  'Des caisses piégées bloquent les couloirs. Casse-les pour rouvrir le passage.',
  'La glace envahit la salle du trône. Fais-la fondre en jouant dessus.',
  'Les fruits du verger royal sont tombés. Ramène-les tout en bas !',
  'Un blob géant garde la salle des coffres. Frappe-le avec tes combos.',
  'Le château brille de nouveau. Mais il reste encore des salles à retrouver...'
];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const MAXL = 5, REGEN = 12 * 60 * 1000;
const LIFE_COST = 50, HAMMER = 30, BOMB_COST = 60, PLUS_COST = 40, CONT_COST = 90, SHUF_COST = 10;
const CASTLE_COST = [100, 220, 400];
const STAR_COINS = 20;
const CASTLE_SLOTS = [['tower', 'Tours'], ['flag', 'Drapeaux'], ['garden', 'Jardin'], ['fountain', 'Fontaine']];
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const key = (r, c) => r + ',' + c;
const inB = (r, c) => r >= 0 && c >= 0 && r < ROWS && c < COLS;
const rnd = a => a[Math.floor(Math.random() * a.length)];
const boardEl = $('board');

let board = [], mask = [], crates = [], ice = [], holeEls = [];
let cell = 40, level = 1, moves = 0, totalMoves = 0, score = 0;
let goals = [], busy = false, ended = false, nextId = 0, sel = null, ncolors = 4, hammer = false;
let timed = 0, timeLeft = 0, storm = false, shufUsed = false;

/* ---------- sauvegarde ---------- */
const SAVE_KEY = 'kingdom_save_v2';
const DEFAULT_SAVE = { level: 1, coins: 100, lives: MAXL, lifeTs: 0, sfx: .8, music: .5, vib: true, cb: false,
  stars: {}, castle: { tower: 0, flag: 0, garden: 0, fountain: 0 }, spent: 0, daily: { day: '', streak: 0 }, story: 0 };
let save = JSON.parse(JSON.stringify(DEFAULT_SAVE));
function normalizeSave(s) {
  const o = { ...JSON.parse(JSON.stringify(DEFAULT_SAVE)), ...s };
  o.castle = { ...DEFAULT_SAVE.castle, ...(s.castle || {}) };
  o.daily = { ...DEFAULT_SAVE.daily, ...(s.daily || {}) };
  o.stars = s.stars && typeof s.stars === 'object' ? s.stars : {};
  if (s.sound === false) { o.sfx = 0; o.music = 0; }
  delete o.sound;
  return o;
}
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = normalizeSave(s); } catch (e) {}
{ const left = Object.values(save.stars).reduce((a, b) => a + b, 0) - save.spent; if (left > 0) { save.coins += left * 20; save.spent += left; } }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function starsTotal() { return Object.values(save.stars).reduce((a, b) => a + b, 0); }
function tickLives() {
  const now = Date.now(); let changed = false;
  if (save.lives >= MAXL) { save.lives = MAXL; save.lifeTs = now; return false; }
  if (!save.lifeTs) save.lifeTs = now;
  while (save.lives < MAXL && now - save.lifeTs >= REGEN) { save.lives++; save.lifeTs += REGEN; changed = true; }
  if (save.lives >= MAXL) save.lifeTs = now;
  return changed;
}
function lifeTimeLeft() {
  if (save.lives >= MAXL) return '';
  const s = Math.ceil(Math.max(0, REGEN - (Date.now() - save.lifeTs)) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dailyAvailable = () => save.daily.day !== ymd(new Date());
function updateStatus() {
  $('lives').textContent = save.lives;
  $('coins').textContent = save.coins;
  $('lifeTimer').textContent = lifeTimeLeft();
  $('dailyBtn').classList.toggle('glow', dailyAvailable());
  $('shufC').textContent = shufUsed ? SHUF_COST : 'gratuit';
  $('plus').firstElementChild.textContent = timed ? '⏱' : '➕';
}

/* ---------- sons et musique ---------- */
let AC = null, sfxG = null, musG = null, musicIv = null;
function applyVolumes() {
  if (sfxG) sfxG.gain.value = save.sfx;
  if (musG) musG.gain.value = save.music * .18;
}
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      sfxG = AC.createGain(); sfxG.connect(AC.destination);
      musG = AC.createGain(); musG.connect(AC.destination);
      applyVolumes(); startMusic();
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function startMusic() {
  if (musicIv || !AC) return;
  const mel = [0, 2, 4, 2, 5, 4, 2, 1, 0, 2, 4, 7, 5, 4, 2, 4], sc = [262, 294, 330, 392, 440, 523, 587, 659];
  let i = 0;
  musicIv = setInterval(() => {
    if (!AC || save.music <= 0 || document.hidden) return;
    const f = sc[mel[i % mel.length]];
    tone(f, .5, 'sine', .6, 1, 0, musG);
    if (i % 4 === 0) tone(f / 2, .95, 'triangle', .5, 1, 0, musG);
    i++;
  }, 430);
}
function tone(f, d = .12, type = 'sine', v = .15, slide = 1, delay = 0, dest) {
  const out = dest || sfxG; if (!AC || !out) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .02);
}
function noise(d = .3, v = .25, f0 = 1500, f1 = 200, delay = 0) {
  if (!AC || !sfxG) return;
  const n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  const t = AC.currentTime + delay;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(sfxG); s.start(t);
}
function vib(ms) { if (save.vib && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
const SFX = {
  swap() { tone(420, .07, 'triangle', .1, 1.3); },
  bad() { tone(160, .16, 'sawtooth', .08, .6); },
  pop(n = 1) { const f = 392 * Math.pow(1.122, Math.min(n - 1, 8)); tone(f, .11, 'sine', .16, 1.6); tone(f * 1.5, .09, 'triangle', .06, 1.2, .03); },
  special() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .13, 'triangle', .12, 1, i * .06)); },
  boom() { noise(.45, .35, 1800, 120); tone(110, .35, 'sine', .3, .3); vib(60); },
  beam() { tone(900, .28, 'sawtooth', .08, .25); noise(.25, .15, 3000, 400); vib(30); },
  rainbow() { [400, 500, 630, 800, 1000, 1260].forEach((f, i) => tone(f, .12, 'sine', .12, 1, i * .04)); noise(.4, .2, 4000, 300, .1); vib(80); },
  crateHit() { noise(.12, .2, 900, 200); tone(180, .08, 'square', .08, .6); },
  crate() { noise(.3, .3, 1400, 150); tone(130, .15, 'square', .1, .5); vib(40); },
  coin() { tone(988, .06, 'square', .07); tone(1319, .14, 'square', .07, 1, .06); },

const randType = () => Math.floor(Math.random() * ncolors);
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function startLevel(skipStory) {
  tickLives();
  if (save.lives <= 0) return showNoLives();
  if (!skipStory && level % 10 === 1 && save.story < level) { save.story = level; persist(); return showStory(); }
  const def = levelDef(level);
  ncolors = def.colors; moves = totalMoves = def.moves; score = 0;
  timed = def.time; timeLeft = def.time; storm = def.type === 'storm'; shufUsed = false;
  ended = false; busy = false; sel = null; hammer = false;
  $('ham').classList.remove('on'); boardEl.classList.remove('hamming');
  boardEl.querySelectorAll('.tile,.crate,.hole,.ice,.toast').forEach(e => e.remove());
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  crates = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  ice = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  mask = MASKS[def.maskIdx].map(row => [...row].map(ch => ch === '#'));
  holeEls = [];
  layout();

  // caisses
  const cand = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) if (mask[r][c]) cand.push([r, c]);
  shuffleArr(cand);
  const placed = [];
  for (const [r, c] of cand) {
    if (placed.length >= def.crateN) break;

  shuffleArr(free);

}

/* ---------- logique ---------- */
function findMatches(pref = []) {
  const hr = [], vr = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = board[r][c];
      if (!t || t.type < 0) { c++; continue; }
      let e = c;
      while (e + 1 < COLS && board[r][e + 1] && board[r][e + 1].type === t.type) e++;
      if (e - c >= 2) hr.push({ r, a: c, b: e });
      c = e + 1;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = board[r][c];
      if (!t || t.type < 0) { r++; continue; }
      let e = r;
      while (e + 1 < ROWS && board[e + 1][c] && board[e + 1][c].type === t.type) e++;
      if (e - r >= 2) vr.push({ c, a: r, b: e });
      r = e + 1;
    }
  }
  if (!hr.length && !vr.length) return null;
  const cells = new Set(), spawn = new Map(), hs = new Set(), vs = new Set();
  const pickPref = (list, fb) => { for (const p of pref) if (list.includes(key(p[0], p[1]))) return key(p[0], p[1]); return fb; };
  for (const h of hr) {
    const list = [];
    for (let c = h.a; c <= h.b; c++) { list.push(key(h.r, c)); cells.add(key(h.r, c)); hs.add(key(h.r, c)); }
    if (list.length >= 5) spawn.set(pickPref(list, list[Math.floor(list.length / 2)]), 'rainbow');
    else if (list.length === 4) spawn.set(pickPref(list, list[1]), 'row');
  }
  for (const v of vr) {
    const list = [];
    for (let r = v.a; r <= v.b; r++) { list.push(key(r, v.c)); cells.add(key(r, v.c)); vs.add(key(r, v.c)); }
    if (list.length >= 5) spawn.set(pickPref(list, list[Math.floor(list.length / 2)]), 'rainbow');
    else if (list.length === 4) spawn.set(pickPref(list, list[1]), 'col');
  }
  for (const k of hs) if (vs.has(k)) spawn.set(k, 'bomb');
  for (const k of spawn.keys()) cells.delete(k);
  return { cells, spawn };
}

function expand(set, hits, events) {
  const q = [...set];
  const add = (r, c) => {
    if (!inB(r, c)) return;
    if (crates[r][c]) { hits.add(key(r, c)); return; }
    const t = board[r][c];
    const k = key(r, c);
    if (t && t.kind !== 'drop' && !set.has(k)) { set.add(k); q.push(k); }
  };
  while (q.length) {
    const [r, c] = q.pop().split(',').map(Number);
    const t = board[r][c];
    if (!t || !t.special || t._fired) continue;
    t._fired = true;
    events.push({ s: t.special, r, c });
    if (t.special === 'row') for (let i = 0; i < COLS; i++) add(r, i);
    else if (t.special === 'col') for (let i = 0; i < ROWS; i++) add(i, c);
    else if (t.special === 'bomb') {
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.abs(dr) + Math.abs(dc) <= 3) add(r + dr, c + dc);
    } else if (t.special === 'rainbow') {
      const cnt = {};
      for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) { const x = board[i][j]; if (x && x.type >= 0) cnt[x.type] = (cnt[x.type] || 0) + 1; }
      let best = -1, bc = 0;
      for (const k in cnt) if (cnt[k] > bc) { bc = cnt[k]; best = +k; }
      for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) if (board[i][j] && board[i][j].type === best) add(i, j);
    }
  }
}

function collect(type) {
  for (const g of goals) if (g.kind === 'color' && g.type === type) g.left = Math.max(0, g.left - 1);
}

async function gravity() {
  for (let c = 0; c < COLS; c++) {
    let r = ROWS - 1;
    while (r >= 0) {
      if (blocked(r, c)) { r--; continue; }
      const bot = r; let top = r;
      while (top - 1 >= 0 && !blocked(top - 1, c)) top--;
      let w = bot;
      for (let i = bot; i >= top; i--) {
        const t = board[i][c];
        if (t) { if (i !== w) { board[w][c] = t; board[i][c] = null; t.r = w; place(t); } w--; }
      }
      const count = w - top + 1;
      for (let i = w; i >= top; i--) board[i][c] = mkTile(i, c, randType(), i - count);
      r = top - 1;
    }
  }
}

function collectDrops() {
  let n = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = board[r][c];
    if (t && t.kind === 'drop' && (r === ROWS - 1 || !mask[r + 1][c])) {
      board[r][c] = null; t.el.classList.add('pop'); setTimeout(() => t.el.remove(), 240);
      for (const g of goals) if (g.kind === 'drop') g.left = Math.max(0, g.left - 1);
      fx.burst(r, c, '#ffc83d', 14, 4); SFX.coin(); score += 100; n++;
    }
  }
  if (n) updateHud();
  return n;
}

async function clearAndFill(m, combo) {
  const set = new Set(m.cells), hits = new Set(m.hits || []), events = [], removed = [];
  expand(set, hits, events);
  let n = 0, gemsHit = 0;
  for (const k of set) {
    const [r, c] = k.split(',').map(Number);
    const t = board[r][c];
    if (!t || t.kind === 'drop') continue;
    if (t.chain) { t.chain = 0; render(t); fx.burst(r, c, '#cfd6e4', 8); SFX.crateHit(); continue; }
    t.el.classList.add('pop');
    if (t.type >= 0) { collect(t.type); fx.burst(r, c, COLORS[t.type], 7); } else fx.burst(r, c, '#ffffff', 12);
    gemsHit++;
    removed.push(t.el); board[r][c] = null; n++;
    if (ice[r][c]) {
      const ic = ice[r][c]; ice[r][c] = null; ic.el.classList.add('pop'); removed.push(ic.el);
      fx.burst(r, c, '#a8e4ff', 10); SFX.crateHit(); score += 30;
      for (const g of goals) if (g.kind === 'ice') g.left = Math.max(0, g.left - 1);
    }
    for (const [dr, dc] of DIRS) { const rr = r + dr, cc = c + dc; if (inB(rr, cc) && crates[rr][cc]) hits.add(key(rr, cc)); }
  }
  for (const g of goals) if (g.kind === 'boss' && gemsHit) { g.left = Math.max(0, g.left - gemsHit); }
  for (const ev of events) {
    if (ev.s === 'bomb') { fx.ring(ev.r, ev.c); fx.burst(ev.r, ev.c, '#ffc83d', 26, 5); shake(); SFX.boom(); }
    else if (ev.s === 'row' || ev.s === 'col') { fx.beam(ev.s, ev.r, ev.c); SFX.beam(); }
    else { fx.ring(ev.r, ev.c); fx.burst(ev.r, ev.c, '#ffffff', 24, 5); shake(); SFX.rainbow(); }
  }
  if (!events.length) SFX.pop(combo);
  let spawned = false;
  for (const [k, s] of m.spawn) {
    if (set.has(k)) continue;
    const [r, c] = k.split(',').map(Number);
    const t = board[r][c]; if (!t) continue;
    t.special = s; if (s === 'rainbow') t.type = -1;
    render(t); score += 20; spawned = true; fx.burst(r, c, '#ffffff', 10, 3);
  }
  if (spawned) SFX.special();
  for (const k of hits) {
    const [r, c] = k.split(',').map(Number);
    const cr = crates[r][c]; if (!cr) continue;
    cr.hp--;
    if (cr.hp <= 0) {
      crates[r][c] = null; cr.el.classList.add('pop'); removed.push(cr.el);
      fx.burst(r, c, '#b8793a', 16, 4); SFX.crate(); score += 50;
      if (!cr.storm) for (const g of goals) if (g.kind === 'crate') g.left = Math.max(0, g.left - 1);
    } else {
      cr.el.innerHTML = crateInner(cr); cr.el.classList.add('hit');
      setTimeout(() => cr.el.classList.remove('hit'), 260); SFX.crateHit();
      fx.burst(r, c, '#b8793a', 6, 2.5);
    }
  }
  score += n * 10 * Math.min(combo, 4);
  if (combo >= 2) {
    kingSay(['', '', 'Bien joué !', 'Magnifique !', 'Royal !', 'Légendaire !'][Math.min(combo, 5)]);
    if (combo >= 3) toast(['', '', '', 'Super !', 'Génial !', 'Royal !'][Math.min(combo, 5)]);
  }
  updateHud();
  await sleep(230);
  removed.forEach(e => e.remove());
  await gravity();
  await sleep(350);
  while (collectDrops()) { await sleep(260); await gravity(); await sleep(350); }
}

async function cascade(first, prefs) {
  let m = first, combo = 0, p = prefs || [];
  while (true) {
    if (!m) m = findMatches(p);
    if (!m) break;
    combo++;
    await clearAndFill(m, combo);
    m = null; p = [];
  }
}

function hasMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = board[r][c]; if (!t) continue;
    if (t.special === 'rainbow' && !t.chain) return true;
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= ROWS || c2 >= COLS) continue;
      const u = board[r2][c2]; if (!u || t.chain || u.chain) continue;
      if (t.special && u.special) return true;
      board[r][c] = u; board[r2][c2] = t;
      const ok = !!findMatches();
      board[r][c] = t; board[r2][c2] = u;
      if (ok) return true;
    }
  }
  return false;
}

function shuffleBoard() {
  const pos = [], tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = board[r][c]; if (t && t.kind !== 'drop') { pos.push([r, c]); tiles.push(t); } }
  for (let attempt = 0; attempt < 80; attempt++) {
    shuffleArr(tiles);
    pos.forEach(([r, c], i) => { board[r][c] = tiles[i]; });
    if (!findMatches() && hasMove()) break;
  }
  pos.forEach(([r, c], i) => { const t = tiles[i]; t.r = r; t.c = c; place(t); });
}

function swapT(a, b) {
  board[a.r][a.c] = b; board[b.r][b.c] = a;
  const ar = a.r, ac = a.c; a.r = b.r; a.c = b.c; b.r = ar; b.c = ac;
  place(a); place(b);
}

async function trySwap(r1, c1, r2, c2) {
  if (busy || ended) return;
  const a = board[r1][c1], b = board[r2][c2];
  if (!a || !b) return;
  if (a.chain || b.chain) { SFX.bad(); kingSay('Enchaîné !'); clearSel(); return; }
  if ((a.special === 'rainbow' && b.kind === 'drop') || (b.special === 'rainbow' && a.kind === 'drop')) { SFX.bad(); clearSel(); return; }
  busy = true; clearSel();
  SFX.swap();
  swapT(a, b);
  await sleep(230);
  let first = null;
  const isR = t => t.special === 'rainbow';
  if (isR(a) || isR(b)) {
    const set = new Set();
    if (isR(a)) a._fired = true;
    if (isR(b)) b._fired = true;
    set.add(key(a.r, a.c)); set.add(key(b.r, b.c));
    if (isR(a) && isR(b)) {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c]) set.add(key(r, c));
    } else {
      const other = isR(a) ? b : a;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = board[r][c]; if (t && other.type >= 0 && t.type === other.type) set.add(key(r, c)); }
    }
    first = { cells: set, spawn: new Map() };
  } else if (a.special && b.special) {
    first = { cells: new Set([key(a.r, a.c), key(b.r, b.c)]), spawn: new Map() };
  } else {
    const m = findMatches([[a.r, a.c], [b.r, b.c]]);
    if (!m) { SFX.bad(); swapT(a, b); await sleep(230); busy = false; return; }
    first = m;
  }
  moves--; updateHud();
  await cascade(first);
  if (storm && moves > 0 && (totalMoves - moves) % 6 === 0) await stormEvent();
  await afterTurn();
}

async function stormEvent() {
  const cand = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) {
    const t = board[r][c];
    if (t && t.kind === 'gem' && !t.special && !t.chain && !ice[r][c]) cand.push([r, c]);
  }
  if (!cand.length) return;
  const [r, c] = rnd(cand), t = board[r][c];
  t.el.classList.add('pop'); setTimeout(() => t.el.remove(), 240);
  board[r][c] = null; crates[r][c] = mkCrate(r, c, 1); crates[r][c].storm = true;
  toast('Tempête !'); kingSay('Une caisse est tombée !'); shake(); SFX.boom();
  updateHud();
  await sleep(260); await gravity(); await sleep(350);
  await cascade(null);
}

async function afterTurn() {
  const won = goals.every(g => g.kind === 'score' ? score >= g.target : g.left === 0);
  if (won) return win();
  if ((timed && timeLeft <= 0) || (!timed && moves <= 0)) return lose();
  if (!hasMove()) { toast('Mélange !'); await sleep(200); shuffleBoard(); await sleep(350); }
  busy = false;
}

setInterval(() => {
  if (tickLives()) persist();
  if (timed && !ended && !$('ov').classList.contains('show')) {
    timeLeft = Math.max(0, timeLeft - 1);
    if (timeLeft === 0 && !busy) lose();
    $('moves').textContent = timeLeft;
  }
  updateStatus();
}, 1000);

/* ---------- écrans ---------- */
function showOv(html) { $('card').innerHTML = html; $('ov').classList.add('show'); $('card').scrollTop = 0; }
function closeOv() { $('ov').classList.remove('show'); }
const canMenu = () => !busy || ended;

function showStory() {
  const k = Math.floor((level - 1) / 10);
  showOv(`<h2>Chapitre ${k + 1}</h2><div style="display:flex;justify-content:center;margin-bottom:6px">${$('kingFace').innerHTML.replace('width="56" height="56"', 'width="84" height="84"')}</div><p>${STORY[k % STORY.length]}</p><div class="row"><button class="big" id="go">Jouer</button></div>`);
  $('go').onclick = () => startLevel(true);
}
function win() {
  ended = true;
  const ratio = timed ? timeLeft / timed : moves / totalMoves;
  const stars = ratio >= .4 ? 3 : ratio >= .2 ? 2 : 1;
  const first = !save.stars[level];
  const newStars = Math.max(0, stars - (save.stars[level] || 0));
  const starCoins = newStars * STAR_COINS;
  const base = first ? 20 + (timed ? Math.floor(timeLeft / 2) : moves * 3) : 10;
  const gain = base + starCoins;
  save.coins += gain; save.spent += newStars;
  save.stars[level] = Math.max(save.stars[level] || 0, stars);
  save.level = Math.max(save.level, level + 1); persist(); updateStatus();
  SFX.win(); setTimeout(() => SFX.coin(), 700);
  showOv(`<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><h2>Niveau ${level} réussi !</h2><p>Score : ${score}<br>+${gain} pièces${starCoins ? ` (dont ${starCoins} pour ${newStars} étoile${newStars > 1 ? 's' : ''})` : ''}${first ? '' : '<br>Niveau rejoué'}</p><div class="row"><button class="big" id="next">Niveau suivant</button><button id="toMap">Carte</button></div>`);
  $('next').onclick = () => { level++; startLevel(); };
  $('toMap').onclick = showMap;
}
function lose() {
  if (ended) return;
  ended = true; SFX.lose();
  const canCont = save.coins >= CONT_COST;
  showOv(`<h2>${timed ? 'Temps écoulé' : 'Plus de coups'}</h2><p>${canCont ? (timed ? 'Continue avec 15 secondes de plus, ou abandonne et perds une vie.' : 'Continue avec 5 coups de plus, ou abandonne et perds une vie.') : 'Abandonner te coûte une vie.'}</p><div class="row">${canCont ? `<button class="gold" id="cont">${timed ? '+15 s' : '+5 coups'} · ${CONT_COST} 🪙</button>` : ''}<button class="big" id="giveup">Abandonner</button></div>`);
  if (canCont) $('cont').onclick = () => {
    save.coins -= CONT_COST; persist(); SFX.coin();
    if (timed) timeLeft += 15; else moves += 5;
    ended = false; busy = false; updateHud(); closeOv();
  };
  $('giveup').onclick = () => {
    tickLives();
    if (save.lives >= MAXL) save.lifeTs = Date.now();
    save.lives = Math.max(0, save.lives - 1); persist();
    startLevel();
  };
}
function buyLife() {
  if (save.coins < LIFE_COST || save.lives >= MAXL) return false;
  tickLives(); save.coins -= LIFE_COST; save.lives++;
  if (save.lives >= MAXL) save.lifeTs = Date.now();
  persist(); SFX.coin(); updateStatus(); return true;
}
function showNoLives() {
  ended = true; busy = true;
  const can = save.coins >= LIFE_COST;
  showOv(`<h2>Plus de vies</h2><p>Prochaine vie dans <b id="nl">${lifeTimeLeft()}</b>.</p><div class="row"><button class="gold" id="buy" ${can ? '' : 'disabled'}>Racheter 1 vie · ${LIFE_COST} 🪙</button></div>${can ? '' : '<p class="muted" style="margin-top:10px">Il te faut ' + LIFE_COST + ' pièces. Récupère le cadeau du jour ou réussis des niveaux.</p>'}<div class="row" style="margin-top:8px"><button id="nlGift">🎁 Cadeau du jour</button></div>`);
  const iv = setInterval(() => {

function showShop() {

  $('buy').onclick = () => { buyLife(); showShop(); };

/* cadeau du jour */
function showDaily(fromNoLives) {
  const avail = dailyAvailable();
  const yest = ymd(new Date(Date.now() - 864e5));
  const streak = avail ? (save.daily.day === yest ? save.daily.streak + 1 : 1) : save.daily.streak;
  const reward = 30 + Math.min(streak, 7) * 10;
  const dayInCycle = ((streak - 1) % 7) + 1;
  const dots = [1, 2, 3, 4, 5, 6, 7].map(d => `<span class="${d <= dayInCycle && (avail ? d < dayInCycle : true) ? 'on' : ''}">${d}</span>`).join('');
  showOv(`<h2>Cadeau du jour</h2><div class="days">${dots}</div>${avail
    ? `<p>Jour ${dayInCycle} de série : <b>+${reward} pièces</b>${dayInCycle === 7 ? '<br>et une vie offerte !' : ''}</p><div class="row"><button class="big" id="claim">Récupérer</button></div>`
    : `<p>Déjà récupéré aujourd'hui.<br>Reviens demain pour continuer ta série (${save.daily.streak} jour${save.daily.streak > 1 ? 's' : ''}).</p><div class="row"><button id="dClose">Fermer</button></div>`}`);
  if (avail) $('claim').onclick = () => {
    save.daily = { day: ymd(new Date()), streak };
    save.coins += reward;
    if (dayInCycle === 7) { tickLives(); if (save.lives < MAXL) { save.lives++; if (save.lives >= MAXL) save.lifeTs = Date.now(); } }
    persist(); SFX.coin(); setTimeout(SFX.coin, 150); updateStatus();
    if (fromNoLives) startLevel(); else closeOv();
  };
  else $('dClose').onclick = () => { if (fromNoLives) showNoLives(); else closeOv(); };
}

  for (const x of [62, 202]) {
    s += `<rect x="${x}" y="${155 - th}" width="36" height="${th}" fill="#cfc8e0" stroke="#6b6489" stroke-width="3"/>`;

    else for (let i = 0; i < 4; i++) s += `<rect x="${x + i * 10}" y="${155 - th - 6}" width="7" height="6" fill="#cfc8e0" stroke="#6b6489" stroke-width="1.5"/>`;

  if (c.garden >= 2) for (const x of [18, 284]) s += `<rect x="${x - 3}" y="130" width="6" height="28" fill="#7a4a1c"/><circle cx="${x}" cy="124" r="16" fill="#2fa84a"/>`;
  if (c.garden >= 3) { s += `<polygon points="140,155 160,155 190,200 110,200" fill="#e6d6a8"/>`; for (const x of [80, 120, 180, 220]) s += `<circle cx="${x}" cy="176" r="4" fill="#ff6fa8"/>`; }

/* réglages, export / import */
function showSettings() {
  const code = 'KM1-' + btoa(JSON.stringify(save));
  showOv(`<h2>Réglages</h2>
  <label class="set">Effets<input type="range" id="sfxR" min="0" max="100" value="${Math.round(save.sfx * 100)}"></label>
  <label class="set">Musique<input type="range" id="musR" min="0" max="100" value="${Math.round(save.music * 100)}"></label>
  <label class="set">Vibrations<input type="checkbox" id="vibC" ${save.vib ? 'checked' : ''}></label>
  <label class="set">Mode daltonien (lettres)<input type="checkbox" id="cbC" ${save.cb ? 'checked' : ''}></label>
  <p class="muted" style="text-align:left;margin-top:6px">Sauvegarde : copie ce code pour retrouver ta progression ailleurs.</p>
  <textarea id="code" rows="3" readonly>${code}</textarea>
  <div class="row" style="margin-bottom:8px"><button id="copyB">Copier le code</button></div>
  <textarea id="imp" rows="2" placeholder="Colle ici un code KM1-..."></textarea>
  <div class="row" style="margin-bottom:12px"><button id="impB">Importer</button><button class="danger" id="resetB">Tout effacer</button></div>
  <div class="row"><button class="big" id="setClose">OK</button></div><p class="muted" id="setMsg" style="margin:8px 0 0"></p>`);
  $('sfxR').oninput = e => { save.sfx = e.target.value / 100; applyVolumes(); persist(); };
  $('sfxR').onchange = () => { initAudio(); SFX.coin(); };
  $('musR').oninput = e => { save.music = e.target.value / 100; initAudio(); applyVolumes(); persist(); };
  $('vibC').onchange = e => { save.vib = e.target.checked; persist(); if (save.vib) vib(40); };
  $('cbC').onchange = e => { save.cb = e.target.checked; persist(); for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c]) render(board[r][c]); };
  $('copyB').onclick = async () => {
    const ta = $('code'); ta.select();
    let ok = false;
    try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (x) {} }
    $('setMsg').textContent = ok ? 'Code copié.' : 'Copie impossible : maintiens le doigt sur le code pour le copier.';
  };
  $('impB').onclick = () => {
    const v = $('imp').value.trim();
    try {
      if (!v.startsWith('KM1-')) throw 0;
      const o = JSON.parse(atob(v.slice(4)));
      if (typeof o.level !== 'number' || typeof o.coins !== 'number') throw 0;
      save = normalizeSave(o); persist(); level = save.level; applyVolumes();
      startLevel(true);
    } catch (e) { $('setMsg').textContent = 'Code invalide.'; }
  };
  let armed = false;
  $('resetB').onclick = () => {
    if (!armed) { armed = true; $('resetB').textContent = 'Confirmer ?'; return; }
    save = JSON.parse(JSON.stringify(DEFAULT_SAVE)); persist(); applyVolumes(); level = 1; startLevel();
  };
  $('setClose').onclick = closeOv;
}

/* ---------- saisie ---------- */
function clearSel() { if (sel) { sel.el.classList.remove('sel'); sel = null; } }
function cellAt(e) {
  const rc = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX - rc.left - 4) / cell), r = Math.floor((e.clientY - rc.top - 4) / cell);
  return inB(r, c) ? { r, c } : null;
}
async function useHammer(r, c) {
  const t = board[r][c], hasCrate = !!crates[r][c];
  if ((!t || t.kind === 'drop') && !hasCrate) return;
  hammer = false; $('ham').classList.remove('on'); boardEl.classList.remove('hamming');
  if (save.coins < HAMMER) return;
  save.coins -= HAMMER; persist(); busy = true; clearSel(); SFX.boom(); shake();
  const first = { cells: new Set(t ? [key(r, c)] : []), spawn: new Map(), hits: new Set(t ? [] : [key(r, c)]) };
  await cascade(first);
  await afterTurn();
}
let down = null;
boardEl.addEventListener('pointerdown', e => {
  initAudio();
  if (busy || ended) return;
  const p = cellAt(e); if (!p) return;
  down = { x: e.clientX, y: e.clientY, r: p.r, c: p.c, moved: false };
  try { boardEl.setPointerCapture(e.pointerId); } catch (x) {}
});
boardEl.addEventListener('pointermove', e => {
  if (!down || down.moved || busy || ended || hammer) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * .35) return;
  down.moved = true;
  let r2 = down.r, c2 = down.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1; else r2 += dy > 0 ? 1 : -1;
  if (!inB(r2, c2)) return;
  trySwap(down.r, down.c, r2, c2);
});
boardEl.addEventListener('pointerup', () => {
  if (down && !down.moved && !busy && !ended) {
    if (hammer) useHammer(down.r, down.c);
    else {
      const t = board[down.r][down.c];
      if (t) {
        if (sel && Math.abs(sel.r - t.r) + Math.abs(sel.c - t.c) === 1) trySwap(sel.r, sel.c, t.r, t.c);
        else if (sel === t) clearSel();
        else { clearSel(); sel = t; t.el.classList.add('sel'); }
      }
    }
  }
  down = null;
});
boardEl.addEventListener('pointercancel', () => { down = null; });

/* boutons */
function needCoins(n) { if (save.coins < n) { toast('Pas assez de pièces'); return true; } return false; }
$('ham').onclick = () => {
  initAudio();
  if (busy || ended) return;
  if (needCoins(HAMMER)) return;
  hammer = !hammer; clearSel();
  $('ham').classList.toggle('on', hammer); boardEl.classList.toggle('hamming', hammer);
};
$('bmb').onclick = () => {
  initAudio();
  if (busy || ended) return;
  if (needCoins(BOMB_COST)) return;
  const c = [];
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) { const t = board[r][q]; if (t && t.kind === 'gem' && !t.special && !t.chain) c.push(t); }
  if (!c.length) return;
  const t = rnd(c);
  save.coins -= BOMB_COST; persist();
  t.special = 'bomb'; render(t); fx.ring(t.r, t.c); SFX.special(); updateStatus(); kingSay('Une bombe pour toi !');
};
$('plus').onclick = () => {
  initAudio();
  if (busy || ended) return;
  if (needCoins(PLUS_COST)) return;
  save.coins -= PLUS_COST; persist(); SFX.coin();
  if (timed) timeLeft += 10; else moves += 1;
  updateHud(); toast(timed ? '+10 s' : '+1 coup');
};
$('shuf').onclick = () => {
  initAudio();
  if (busy || ended) return;
  if (shufUsed) { if (needCoins(SHUF_COST)) return; save.coins -= SHUF_COST; persist(); }
  shufUsed = true; clearSel(); SFX.swap(); shuffleBoard(); updateStatus();
};
$('rest').onclick = () => { initAudio(); if (canMenu()) startLevel(true); };
$('livesBtn').onclick = () => { if (canMenu()) showShop(); };
$('coinsBtn').onclick = () => { if (canMenu()) showShop(); };
$('dailyBtn').onclick = () => { initAudio(); if (canMenu()) showDaily(); };
$('castleBtn').onclick = () => { if (canMenu()) showCastle(); };
$('lvlBtn').onclick = () => { if (canMenu()) showMap(); };
$('setBtn').onclick = () => { initAudio(); if (canMenu()) showSettings(); };

level = save.level;
if (tickLives()) persist();
startLevel();
if (dailyAvailable()) setTimeout(() => { if (!$('ov').classList.contains('show') && canMenu()) showDaily(); }, 600);
</script>
</body>
</html>
