name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "debug = APK de test | release = AAB Google Play | keystore = creer la cle"
        type: choice
        options: [debug, release, keystore]
        default: debug

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CONTACT_EMAIL: "rachrachidabak@gmail.com"

jobs:
  keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'keystore'
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Kingdom Match, O=Kingdom Match, C=FR"
          base64 -w0 upload.keystore > keystore-base64.txt
          printf "KEYSTORE_PASSWORD=%s\nKEY_ALIAS=upload\nKEY_PASSWORD=%s\n" "$PASS" "$PASS" > secrets-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-PRIVATE
          retention-days: 1
          path: |
            upload.keystore
            keystore-base64.txt
            secrets-info.txt

  site:
    if: github.event_name == 'push' || inputs.mode != 'keystore'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - name: Write privacy page
        run: |
          mkdir site
          cat > site/privacy.html <<'EOF2'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Kingdom Match - Politique de confidentialite</title>
          <style>
          body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.55;color:#1b1b2f;background:#fff}
          @media (prefers-color-scheme:dark){body{background:#14102e;color:#f1ecff}a{color:#ffc83d}}
          h1{font-size:26px}h2{font-size:19px;margin-top:28px}
          </style>
          </head>
          <body>
          <h1>Politique de confidentialité – Kingdom Match</h1>
          <p>Dernière mise à jour : 4 octobre 2026</p>
          <h2>1. Qui sommes-nous</h2>
          <p>Kingdom Match est un jeu de réflexion (match-3) gratuit. Pour toute question sur cette politique, écris à : <strong>TON_EMAIL@exemple.com</strong>.</p>
          <h2>2. Données enregistrées sur ton appareil</h2>
          <p>Le jeu enregistre uniquement sur ton appareil ta progression : niveau atteint, pièces, vies, étoiles, réglages (son, vibrations, mode daltonien) et décorations du château. Aucun compte n'est demandé. Ces données ne sont pas envoyées à nos serveurs. Elles sont supprimées si tu désinstalles le jeu ou effaces ses données.</p>
          <h2>3. Publicités</h2>
          <p>Le jeu affiche des publicités grâce à Google AdMob. Google et ses partenaires publicitaires peuvent collecter et utiliser certaines données, comme l'identifiant publicitaire de ton appareil, l'adresse IP, des informations sur l'appareil et sur l'usage de l'application, pour diffuser et mesurer des publicités, et pour prévenir la fraude.</p>
          <p>Dans l'Espace économique européen, au Royaume-Uni et en Suisse, une fenêtre de consentement te permet d'accepter ou de refuser les publicités personnalisées. Tu peux modifier ton choix à tout moment dans Réglages &gt; Options de confidentialité des pubs lorsque cette option est proposée. Tu peux aussi réinitialiser ou supprimer ton identifiant publicitaire dans les paramètres Android de ton appareil.</p>
          <p>Pour en savoir plus : <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">comment Google utilise les données</a>.</p>
          <h2>4. Partage des données</h2>
          <p>Nous ne vendons pas de données personnelles. Les seules données traitées par des tiers sont celles décrites au point 3, collectées par Google AdMob.</p>
          <h2>5. Enfants</h2>
          <p>Kingdom Match n'est pas destiné aux enfants de moins de 13 ans et ne cherche pas à collecter sciemment d'informations les concernant.</p>
          <h2>6. Tes droits</h2>
          <p>Comme nous ne conservons aucune donnée personnelle sur nos serveurs, il n'y a rien à nous demander de supprimer. Pour les données traitées par Google, utilise les outils de ton compte Google ou les options de confidentialité du jeu.</p>
          <h2>7. Modifications</h2>
          <p>Cette politique peut évoluer. La date de dernière mise à jour est indiquée en haut de cette page.</p>
          </body>
          </html>
          EOF2
          sed -i "s|TON_EMAIL@exemple.com|${CONTACT_EMAIL}|" site/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

  build:
    if: github.event_name == 'push' || inputs.mode != 'keystore'
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.mode == 'release' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Project files
        run: |
          cat > package.json <<'EOF2'
          {
            "name": "kingdom-match",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor-community/admob": "^7.0.0"
            }
          }
          EOF2
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.kingdommatch.game",
            "appName": "Kingdom Match",
            "webDir": "www"
          }
          EOF2
          npm install

      - name: Make icons and Play Store images
        run: |
          pip install pillow
          mkdir -p assets play
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          def gradient(w, h, c1, c2):
              img = Image.new('RGB', (w, h))
              px = img.load()
              for y in range(h):
                  for x in range(w):
                      t = y / h * 0.7 + x / w * 0.3
                      px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))
              return img
          def crown(size):
              S = size * 2
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              k = S / 1024
              P = lambda pts: [(x * k, y * k) for x, y in pts]
              d.polygon(P([(230,650),(230,390),(380,530),(512,350),(644,530),(794,390),(794,650)]), fill=(0,0,0,70))
              d.polygon(P([(220,640),(220,370),(375,515),(512,330),(649,515),(804,370),(804,640)]), fill=(255,200,61,255), outline=(166,93,0,255), width=int(14*k))
              d.rounded_rectangle([v * k for v in (200,610,824,780)], radius=int(40*k), fill=(255,200,61,255), outline=(166,93,0,255), width=int(14*k))
              d.rounded_rectangle([v * k for v in (230,625,794,660)], radius=int(18*k), fill=(255,232,140,255))
              for cx, cy in ((220,370),(512,330),(804,370)):
                  d.ellipse([(cx-42)*k,(cy-42)*k,(cx+42)*k,(cy+42)*k], fill=(255,200,61,255), outline=(166,93,0,255), width=int(12*k))
              for cx, col in ((340,(255,77,90)),(512,(61,139,255)),(684,(61,220,132))):
                  d.ellipse([(cx-42)*k,(700-42)*k,(cx+42)*k,(700+42)*k], fill=col+(255,), outline=(255,255,255,255), width=int(8*k))
              return img.resize((size, size), Image.LANCZOS)
          def font(n):
              try:
                  return ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', n)
              except Exception:
                  return ImageFont.load_default(size=n)
          bg = gradient(1024, 1024, (118,85,234), (67,48,173)).convert('RGBA')
          bg.alpha_composite(crown(1024))
          bg.convert('RGB').save('assets/icon-only.png')
          bg.convert('RGB').resize((512, 512), Image.LANCZOS).save('play/play-icon-512.png')
          gradient(1024, 1024, (118,85,234), (67,48,173)).save('assets/icon-background.png')
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          fg.alpha_composite(crown(1024).resize((680, 680), Image.LANCZOS), (172, 172))
          fg.save('assets/icon-foreground.png')
          fe = gradient(1024, 500, (118,85,234), (40,28,120)).convert('RGBA')
          fe.alpha_composite(crown(380), (60, 60))
          d = ImageDraw.Draw(fe)
          d.text((470, 150), 'Kingdom', font=font(84), fill=(255,248,231,255))
          d.text((470, 245), 'Match', font=font(84), fill=(255,200,61,255))
          d.text((472, 365), 'Le match-3 royal', font=font(38), fill=(227,220,255,255))
          fe.convert('RGB').save('play/feature-graphic-1024x500.png')
          PY
          ls -la assets play

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ "$RELEASE" = "true" ]; then
            sed -i 's/const AD_TESTING = true;/const AD_TESTING = false;/' www/index.html
          fi
          grep -n "const AD_TESTING" www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets generate --android || echo "icons skipped"

      - name: Patch manifest and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8869215162926660~5195083908"/>\n    </application>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n "APPLICATION_ID\|screenOrientation" $M
          grep -n "versionCode" android/app/build.gradle
          npx cap sync android

      - name: Build debug APK
        if: env.RELEASE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check signing secrets
        if: env.RELEASE == 'true'
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEYPASS" ]; then
            echo "Secrets de signature manquants (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi

      - name: Build signed release AAB
        if: env.RELEASE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          python - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          signing = '''    signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KS_PASS")
                  keyAlias System.getenv("KS_ALIAS")
                  keyPassword System.getenv("KS_KEYPASS")
              }
          }
          '''
          s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace("        release {\n            minifyEnabled false", "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false", 1)
          assert "signingConfig signingConfigs.release" in s, "patch build.gradle impossible"
          open(p, 'w').write(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload APK (test)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-match-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Google Play)
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-match-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store images
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-store-images
          path: play/
